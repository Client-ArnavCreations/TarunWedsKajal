<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" class="face face-bride" role="img" aria-label="Illustration of Kajal"><style><![CDATA[.face-groom .br,.face-groom .ey,.face-groom .lc,.face-groom .sw,.face-groom .sh,.face-groom .gl,.face-bride .br,.face-bride .ey,.face-bride .lc,.face-bride .sw,.face-bride .jh,.face-bride .tw,.face-bride .gl{transform-box:fill-box}
.face-groom .br,.face-bride .br{transform-origin:50% 100%;animation:fc-br 5.6s ease-in-out infinite}
.face-groom .hd,.face-bride .hd{transform-box:view-box;transform-origin:100px 148px;animation:fc-hd 7s ease-in-out infinite}
.face-bride .br{animation-delay:-2s}
.face-bride .hd{animation-duration:8s;animation-delay:-2.5s}
.face-groom .ey,.face-bride .ey{transform-origin:50% 55%;animation:fc-bl 4.3s ease-in-out infinite -1s}
.face-groom .lc,.face-bride .lc{opacity:0;animation:fc-lc 4.3s ease-in-out infinite -1s}
.face-bride .ey,.face-bride .lc{animation-duration:3.7s;animation-delay:-2.9s}
.face-groom .sw{transform-origin:50% 100%;animation:fc-sw 6s ease-in-out infinite}
.face-bride .sw{transform-origin:50% 0;animation:fc-sd 7.5s ease-in-out infinite}
.face-bride .jh{transform-origin:50% 0;animation:fc-jh 4.6s ease-in-out infinite}
.face-bride .j2{animation-duration:5.3s;animation-delay:-2.1s}
.face-bride .tw{transform-origin:50% 50%;animation:fc-tw 3.4s ease-in-out infinite}
.face-bride .t2{animation-delay:-1.1s;animation-duration:4.1s}
.face-bride .t3{animation-delay:-2.3s;animation-duration:2.9s}
.face-groom .sh{animation:fc-sh 7s ease-in-out infinite}
.face-groom .gl,.face-bride .gl{animation:fc-gl 6s ease-in-out infinite}
@keyframes fc-br{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.02)}}
@keyframes fc-hd{0%,100%{transform:rotate(-1deg)}50%{transform:translate(0,-.8px) rotate(1.2deg)}}
@keyframes fc-bl{0%,91%,100%{transform:scaleY(1);opacity:1}95%{transform:scaleY(.06);opacity:0}}
@keyframes fc-lc{0%,92%,98%,100%{opacity:0}95%{opacity:1}}
@keyframes fc-sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes fc-sd{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.8deg)}}
@keyframes fc-jh{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes fc-tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(30deg)}}
@keyframes fc-sh{0%,100%{transform:translate(-1px,0)}50%{transform:translate(1.4px,-.4px)}}
@keyframes fc-gl{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.face-groom *,.face-bride *{animation:none!important}}]]></style><defs>
